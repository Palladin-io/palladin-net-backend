name: Release artifact

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: release-artifact-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attest-backend-image:
    name: Build and attest backend image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to check out the tested source revision.
      id-token: write # Required for Sigstore-backed artifact attestations.
      attestations: write # Required to publish attestations for the repository.

    env:
      SOURCE_SHA: ${{ github.sha }}
      TEST_RUN_ID: ${{ github.run_id }}
      TEST_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Build the backend image from the tested source
        run: |
          set -euo pipefail
          docker build --build-arg "SOURCE_REVISION=$SOURCE_SHA" \
            --tag "palladin-api:$SOURCE_SHA" .
          mkdir -p "$RUNNER_TEMP/backend-release"
          docker save "palladin-api:$SOURCE_SHA" \
            --output "$RUNNER_TEMP/backend-release/palladin-api-$SOURCE_SHA.tar"

      - name: Generate the backend image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: palladin-api:${{ env.SOURCE_SHA }}
          format: spdx-json
          output-file: ${{ runner.temp }}/backend-release/sbom-backend.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Bind the artifact to its source and successful test run
        run: |
          set -euo pipefail
          release="$RUNNER_TEMP/backend-release"
          artifact="palladin-api-$SOURCE_SHA.tar"
          sbom="sbom-backend.spdx.json"
          artifact_sha256="$(sha256sum "$release/$artifact" | cut -d ' ' -f 1)"
          sbom_sha256="$(sha256sum "$release/$sbom" | cut -d ' ' -f 1)"
          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg testRunId "$TEST_RUN_ID" \
            --arg testRunUrl "$TEST_RUN_URL" \
            --arg artifact "$artifact" \
            --arg artifactSha256 "$artifact_sha256" \
            --arg sbom "$sbom" \
            --arg sbomSha256 "$sbom_sha256" \
            '{schemaVersion: 1, sourceSha: $sourceSha, testRunId: $testRunId,
              testRunUrl: $testRunUrl, artifact: {name: $artifact, sha256: $artifactSha256},
              sbom: {name: $sbom, sha256: $sbomSha256}}' \
            > "$release/release-manifest-backend.json"
          (cd "$release" && sha256sum "$artifact" "$sbom" release-manifest-backend.json \
            > SHA256SUMS-backend)
          (cd "$release" && sha256sum --check SHA256SUMS-backend)

      - name: Attest the backend image archive
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/backend-release/palladin-api-${{ env.SOURCE_SHA }}.tar

      - name: Attest the backend image SBOM
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ runner.temp }}/backend-release/palladin-api-${{ env.SOURCE_SHA }}.tar
          sbom-path: ${{ runner.temp }}/backend-release/sbom-backend.spdx.json

      - name: Retain the backend release set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-release-${{ env.SOURCE_SHA }}
          path: ${{ runner.temp }}/backend-release/*
          if-no-files-found: error
          retention-days: 30
